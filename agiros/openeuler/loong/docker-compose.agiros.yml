version: "3.8"

# AGIROS Loong (openEuler) Docker Compose
# Usage:
#   TARGET=base docker compose -f docker-compose.agiros.yml up -d
#   TARGET=dev docker compose up -d
#   docker compose exec agiros bash

services:
  agiros:
    build:
      context: .
      dockerfile: Dockerfile.agiros-multistage
      target: ${TARGET:-base}
      args:
        USERNAME: ${USER:-ros}
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: agiros:openeuler-loong-${TARGET:-base}
    container_name: agiros-openeuler-loong

    network_mode: host
    privileged: true

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_travodds_cpp

    volumes:
      - ./workspace:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/${USER:-ros}/.Xauthority:rw
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    stdin_open: true
    tty: true
    command: bash
