name: Build Docker Images

on:
  push:
    branches:
      - master
      - main
      - dev
    tags:
      - 'v*'
    paths:
      - 'agiros/**'
      - 'ros2/**'
      - '.github/workflows/docker-build.yml'
      - 'src/**'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'agiros/**'
      - 'ros2/**'
      - '.github/workflows/docker-build.yml'
      - 'src/**'
  workflow_dispatch:
    inputs:
      build_agiros_openeuler:
        description: 'Build AGIROS openEuler Image'
        required: false
        default: true
        type: boolean
      build_ros2_openeuler:
        description: 'Build ROS2 Humble openEuler Image'
        required: false
        default: true
        type: boolean
      build_agiros_ubuntu:
        description: 'Build AGIROS Ubuntu Image'
        required: false
        default: true
        type: boolean
      build_ros2_foxy_ubuntu:
        description: 'Build ROS2 Foxy Ubuntu Image'
        required: false
        default: true
        type: boolean
      build_ros2_humble_ubuntu:
        description: 'Build ROS2 Humble Ubuntu Image'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com
  AGIROS_IMAGE: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/agiros_docker
  ROS2_IMAGE: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-humble-openeuler
  AGIROS_UBUNTU_IMAGE: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/agiros_docker-ubuntu
  ROS2_FOXY_UBUNTU_IMAGE: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-foxy-ubuntu
  ROS2_HUMBLE_UBUNTU_IMAGE: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-humble-ubuntu

jobs:
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && (github.event.head_commit.message == null || startsWith(github.event.head_commit.message, '[builder_imgs]'))) ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: agiros-openeuler
            name: AGIROS openEuler Image
            dockerfile: agiros/openeuler/Dockerfile-openeuler-loong
            image: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/agiros_docker
            input: build_agiros_openeuler
            # ACR 不支持 BuildKit registry cache 清单，改用 inline 将缓存写入镜像
            cache_from: type=registry,ref=crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/agiros_docker:latest
            cache_to: type=inline
          - id: ros2-openeuler
            name: ROS2 Humble openEuler Image
            dockerfile: ros2/openeuler/Dockerfile-openeuler-humble
            image: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-humble-openeuler
            input: build_ros2_openeuler
            cache_from: type=registry,ref=crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-humble-openeuler:latest
            cache_to: type=inline
          - id: agiros-ubuntu
            name: AGIROS Ubuntu Image
            dockerfile: agiros/ubuntu/Dockerfile-jammy
            image: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/agiros_docker-ubuntu
            input: build_agiros_ubuntu
            # ACR 不支持 BuildKit registry cache 清单，改用 inline 将缓存写入镜像
            cache_from: type=registry,ref=crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/agiros_docker-ubuntu:latest
            cache_to: type=inline
          - id: ros2-foxy-ubuntu
            name: ROS2 Foxy Ubuntu Image
            dockerfile: ros2/ubuntu/Dockerfile-foxy
            image: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-foxy-ubuntu
            input: build_ros2_foxy_ubuntu
            cache_from: type=registry,ref=crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-foxy-ubuntu:latest
            cache_to: type=inline
          - id: ros2-humble-ubuntu
            name: ROS2 Humble Ubuntu Image
            dockerfile: ros2/ubuntu/Dockerfile-humble
            image: crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-humble-ubuntu
            input: build_ros2_humble_ubuntu
            cache_from: type=registry,ref=crpi-6q1jqce6oh00ahfb.cn-beijing.personal.cr.aliyuncs.com/jhaiq/ros2-humble-ubuntu:latest
            cache_to: type=inline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # workflow_dispatch: only build this image if its input is true (matrix not available in job-level if)
      - name: Check workflow_dispatch input
        if: github.event_name == 'workflow_dispatch'
        id: check_dispatch
        run: |
          case "${{ matrix.input }}" in
            build_agiros_openeuler) val="${{ inputs.build_agiros_openeuler }}" ;;
            build_ros2_openeuler) val="${{ inputs.build_ros2_openeuler }}" ;;
            build_agiros_ubuntu) val="${{ inputs.build_agiros_ubuntu }}" ;;
            build_ros2_foxy_ubuntu) val="${{ inputs.build_ros2_foxy_ubuntu }}" ;;
            build_ros2_humble_ubuntu) val="${{ inputs.build_ros2_humble_ubuntu }}" ;;
            *) val="false" ;;
          esac
          echo "should_build=$val" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: github.event_name != 'workflow_dispatch' || steps.check_dispatch.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch' || steps.check_dispatch.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: (github.event_name != 'workflow_dispatch' || steps.check_dispatch.outputs.should_build == 'true') && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: github.event_name != 'workflow_dispatch' || steps.check_dispatch.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        if: (github.event_name != 'workflow_dispatch' || steps.check_dispatch.outputs.should_build == 'true') && github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}

      - name: Build multi-arch image (PR, same repo)
        if: (github.event_name != 'workflow_dispatch' || steps.check_dispatch.outputs.should_build == 'true') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Build multi-arch image (PR, fork)
        if: (github.event_name != 'workflow_dispatch' || steps.check_dispatch.outputs.should_build == 'true') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
