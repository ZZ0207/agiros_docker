name: Build and Push Docker Images to Harbor

on:
# 自动构建已关闭，稳定后再开启
#  push:
#    branches:
#      - master
#      - main
#      - dev
#    tags:
#      - 'v*'
#    paths:
#      - 'agiros/**'
#      - 'ros2/**'
#      - '.github/workflows/docker-build.yml'
#      - 'src/**'
#  pull_request:
#    branches:
#      - master
#      - main
#      - 2606
#    paths:
#      - 'agiros/**'
#      - 'ros2/**'
#      - '.github/workflows/docker-build.yml'
#      - 'src/**'
  workflow_dispatch:
    inputs:
      build_agiros_loong_openeuler:
        description: 'Build agiros-loong-openeuler'
        required: false
        default: true
        type: boolean
      build_ros2_humble_openeuler:
        description: 'Build ros2-humble-openeuler'
        required: false
        default: true
        type: boolean
      build_agiros_loong_ubuntu:
        description: 'Build agiros-loong-ubuntu'
        required: false
        default: true
        type: boolean
      build_agiros_unitree_ubuntu:
        description: 'Build agiros-unitree-ubuntu'
        required: false
        default: true
        type: boolean
      build_ros2_foxy_ubuntu:
        description: 'Build ros2-foxy-ubuntu'
        required: false
        default: true
        type: boolean
      build_ros2_humble_ubuntu:
        description: 'Build ros2-humble-ubuntu'
        required: false
        default: true
        type: boolean
      build_agiros_loong_ubuntu_base:
        description: 'Build agiros-loong-ubuntu-base (multistage)'
        required: false
        default: false
        type: boolean
      build_agiros_loong_ubuntu_dev:
        description: 'Build agiros-loong-ubuntu-dev (multistage)'
        required: false
        default: false
        type: boolean
      build_agiros_loong_ubuntu_desktop:
        description: 'Build agiros-loong-ubuntu-desktop (multistage)'
        required: false
        default: false
        type: boolean
      build_agiros_loong_ubuntu_desktop_full:
        description: 'Build agiros-loong-ubuntu-desktop-full (multistage)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ==================== openEuler (amd64 + arm64 + riscv64) ====================
          - id: agiros-loong-openeuler
            dockerfile: agiros/openeuler/Dockerfile-openeuler-loong
            platforms: linux/amd64,linux/arm64,linux/riscv64
            image: docker.agiros.org.cn/agiros/agiros-loong-openeuler
            input: build_agiros_loong_openeuler
          - id: ros2-humble-openeuler
            dockerfile: ros2/openeuler/Dockerfile-openeuler-humble
            platforms: linux/amd64,linux/arm64,linux/riscv64
            image: docker.agiros.org.cn/agiros/ros2-humble-openeuler
            input: build_ros2_humble_openeuler
          # ==================== Ubuntu (amd64 + arm64) ====================
          - id: agiros-loong-ubuntu
            dockerfile: agiros/ubuntu/Dockerfile-jammy
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/agiros-loong-ubuntu
            input: build_agiros_loong_ubuntu
          - id: agiros-unitree-ubuntu
            dockerfile: agiros/ubuntu/unitree_go2_ws/Dockerfile-multistage
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/agiros-unitree-ubuntu
            input: build_agiros_unitree_ubuntu
          - id: ros2-foxy-ubuntu
            dockerfile: ros2/ubuntu/Dockerfile-foxy
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/ros2-foxy-ubuntu
            input: build_ros2_foxy_ubuntu
          - id: ros2-humble-ubuntu
            dockerfile: ros2/ubuntu/Dockerfile-humble
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/ros2-humble-ubuntu
            input: build_ros2_humble_ubuntu
          # ============ Loong multistage Ubuntu (amd64 + arm64) ============
          - id: agiros-loong-ubuntu-base
            dockerfile: agiros/ubuntu/loong/Dockerfile.agiros-multistage
            target: base
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/agiros-loong-ubuntu-base
            input: build_agiros_loong_ubuntu_base
          - id: agiros-loong-ubuntu-dev
            dockerfile: agiros/ubuntu/loong/Dockerfile.agiros-multistage
            target: dev
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/agiros-loong-ubuntu-dev
            input: build_agiros_loong_ubuntu_dev
          - id: agiros-loong-ubuntu-desktop
            dockerfile: agiros/ubuntu/loong/Dockerfile.agiros-multistage
            target: desktop
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/agiros-loong-ubuntu-desktop
            input: build_agiros_loong_ubuntu_desktop
          - id: agiros-loong-ubuntu-desktop-full
            dockerfile: agiros/ubuntu/loong/Dockerfile.agiros-multistage
            target: desktop-full
            platforms: linux/amd64,linux/arm64
            image: docker.agiros.org.cn/agiros/agiros-loong-ubuntu-desktop-full
            input: build_agiros_loong_ubuntu_desktop_full
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check workflow_dispatch input
        id: check_dispatch
        run: |
          case "${{ matrix.input }}" in
            build_agiros_loong_openeuler)         val="${{ inputs.build_agiros_loong_openeuler }}" ;;
            build_ros2_humble_openeuler)           val="${{ inputs.build_ros2_humble_openeuler }}" ;;
            build_agiros_loong_ubuntu)             val="${{ inputs.build_agiros_loong_ubuntu }}" ;;
            build_agiros_unitree_ubuntu)           val="${{ inputs.build_agiros_unitree_ubuntu }}" ;;
            build_ros2_foxy_ubuntu)                val="${{ inputs.build_ros2_foxy_ubuntu }}" ;;
            build_ros2_humble_ubuntu)              val="${{ inputs.build_ros2_humble_ubuntu }}" ;;
            build_agiros_loong_ubuntu_base)        val="${{ inputs.build_agiros_loong_ubuntu_base }}" ;;
            build_agiros_loong_ubuntu_dev)         val="${{ inputs.build_agiros_loong_ubuntu_dev }}" ;;
            build_agiros_loong_ubuntu_desktop)     val="${{ inputs.build_agiros_loong_ubuntu_desktop }}" ;;
            build_agiros_loong_ubuntu_desktop_full) val="${{ inputs.build_agiros_loong_ubuntu_desktop_full }}" ;;
            *) val="false" ;;
          esac
          echo "should_build=$val" >> $GITHUB_OUTPUT

      - name: Install Harbor self-signed CA certificate (for docker CLI)
        if: steps.check_dispatch.outputs.should_build == 'true'
        run: |
          REGISTRY="docker.agiros.org.cn"
          CERT_DIR="/etc/docker/certs.d/${REGISTRY}"
          sudo mkdir -p "${CERT_DIR}"
          echo "${{ secrets.HARBOR_CA_CERT }}" | sudo tee "${CERT_DIR}/ca.crt" > /dev/null
          # BuildKit config: use insecure flag for self-signed registry
          # (CA file path would not be accessible inside the BuildKit container)
          mkdir -p /tmp/buildkit
          printf '[registry."docker.agiros.org.cn"]\n  insecure = true\n' > /tmp/buildkit/buildkitd.toml

      - name: Set up QEMU
        if: steps.check_dispatch.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_dispatch.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          config: /tmp/buildkit/buildkitd.toml

      - name: Login to Harbor Registry
        if: steps.check_dispatch.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.agiros.org.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata
        if: steps.check_dispatch.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        if: steps.check_dispatch.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

